<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="./favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#eef5f1">
    <title>File Viewer — Preview 135+ File Formats</title>
    <style>
      :root {
        color-scheme: light;
        background: #eef5f1;
      }

      html,
      body {
        margin: 0;
        min-width: 320px;
        min-height: 100%;
        background: #eef5f1;
        color: #172033;
        font-family: Aptos, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      body {
        min-height: 100vh;
      }

      #app {
        min-height: 100vh;
      }

      /* Vue mounting skeleton — prevents blank screen during load */
      .app-boot-screen {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
        background:
          linear-gradient(90deg, rgba(31, 150, 110, 0.07) 1px, transparent 1px),
          linear-gradient(180deg, rgba(31, 150, 110, 0.06) 1px, transparent 1px),
          linear-gradient(135deg, #eef5f1 0%, #f8fbff 52%, #edf7f2 100%);
        background-size: 28px 28px, 28px 28px, auto;
        box-sizing: border-box;
      }

      .app-boot-shell {
        width: min(960px, 100%);
        display: grid;
        grid-template-columns: 1fr;
        gap: 18px;
        align-items: stretch;
      }

      .app-boot-preview {
        min-width: 0;
        border: 1px solid rgba(114, 137, 161, 0.2);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 24px 70px rgba(41, 66, 90, 0.12);
        display: grid;
        grid-template-rows: auto 1fr;
        overflow: hidden;
      }

      .app-boot-toolbar {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 14px 16px;
        border-bottom: 1px solid rgba(114, 137, 161, 0.18);
      }

      .app-boot-dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: #1f966e;
      }

      .app-boot-chip,
      .app-boot-line,
      .app-boot-page {
        background: linear-gradient(90deg, #eef3f7 0%, #f9fbfd 45%, #e7eff4 100%);
        background-size: 240% 100%;
        animation: bootShimmer 1.6s ease-in-out infinite;
      }

      .app-boot-chip {
        width: 86px;
        height: 18px;
        border-radius: 999px;
      }

      .app-boot-chip:nth-child(4) {
        width: 118px;
        margin-left: auto;
      }

      .app-boot-canvas {
        display: grid;
        grid-template-columns: 140px 1fr;
        gap: 18px;
        padding: 18px;
        background: #f4f8fb;
      }

      .app-boot-nav {
        display: grid;
        gap: 12px;
        align-content: start;
      }

      .app-boot-line {
        height: 14px;
        border-radius: 999px;
      }

      .app-boot-line:nth-child(2) {
        width: 72%;
      }

      .app-boot-line:nth-child(3) {
        width: 86%;
      }

      .app-boot-page {
        min-height: 300px;
        border: 1px solid rgba(114, 137, 161, 0.16);
        border-radius: 8px;
        background-color: #ffffff;
      }

      @keyframes bootShimmer {
        0% {
          background-position: 160% 0;
        }

        100% {
          background-position: -120% 0;
        }
      }

      @media (max-width: 720px) {
        .app-boot-screen {
          padding: 18px;
        }

        .app-boot-canvas {
          grid-template-columns: 1fr;
        }

        .app-boot-nav {
          display: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-boot-chip,
        .app-boot-line,
        .app-boot-page {
          animation: none;
        }
      }
    </style>
    <script>
      // === Craftisle rebrand & sample-disable script ===
      //  Runs after Vue mounts; re-runs on DOM mutations.

      // 1. Replace brand text in ALL text nodes (FlyFish → Craftisle, etc.)
      function replaceBrandText() {
        const walker = document.createTreeWalker(
          document.body,
          NodeFilter.SHOW_TEXT,
          null,
          false
        );
        let node;
        while (node = walker.nextNode()) {
          if (node.nodeValue.includes('FlyFish')) {
            node.nodeValue = node.nodeValue.replace(/FlyFish/g, 'Craftisle');
          }
          if (node.nodeValue.includes('flyfish')) {
            node.nodeValue = node.nodeValue.replace(/flyfish/g, 'craftisle');
          }
          if (node.nodeValue.includes('Pure Web')) {
            node.nodeValue = node.nodeValue.replace(/Pure Web/g, 'Free Online');
          }
        }

        // Also replace in attributes (aria-label, title, placeholder)
        document.querySelectorAll('[aria-label], [title], [placeholder]').forEach(el => {
          ['aria-label', 'title', 'placeholder'].forEach(attr => {
            const val = el.getAttribute(attr);
            if (val && val.includes('FlyFish')) {
              el.setAttribute(attr, val.replace(/FlyFish/g, 'Craftisle'));
            }
            if (val && val.includes('flyfish')) {
              el.setAttribute(attr, val.replace(/flyfish/g, 'craftisle'));
            }
            if (val && val.includes('Pure Web')) {
              el.setAttribute(attr, val.replace(/Pure Web/g, 'Free Online'));
            }
          });
        });
      }

      // 2. Disable sample file clicks (clear example URLs)
      function disableSampleClicks() {
        // Remove href from <a> tags pointing to /example/
        document.querySelectorAll('a[href*="example/"]').forEach(el => {
          el.removeAttribute('href');
          el.style.pointerEvents = 'none';
          el.style.opacity = '0.5';
          el.title = 'Sample preview disabled';
        });

        // Remove onclick handlers that reference example files
        document.querySelectorAll('*').forEach(el => {
          const onclick = (el.getAttribute('onclick') || '').toLowerCase();
          const href = (el.getAttribute('href') || '').toLowerCase();
          if (onclick.includes('example') || href.includes('example')) {
            el.removeAttribute('onclick');
            el.style.pointerEvents = 'none';
            el.style.opacity = '0.5';
          }
        });
      }

      // 3. Hide FlyFish logo (brand text already replaced by replaceBrandText)
      function hideLogo() {
        document.querySelectorAll('img').forEach(img => {
          const src = (img.getAttribute('src') || '').toLowerCase();
          const alt = (img.getAttribute('alt') || '').toLowerCase();
          if (src.includes('logo') || alt.includes('logo')) {
            img.style.display = 'none';
          }
        });
      }

      // Run once on DOMContentLoaded
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => {
          replaceBrandText();
          disableSampleClicks();
          hideLogo();
        });
      } else {
        replaceBrandText();
        disableSampleClicks();
        hideLogo();
      }

      // Re-run after every Vue re-render
      const observer = new MutationObserver(() => {
        replaceBrandText();
        disableSampleClicks();
        hideLogo();
      });
      observer.observe(document.body, { childList: true, subtree: true });
    </script>
    <script type="module" crossorigin src="./assets/index-CLEdsJjy.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BjTZLd3d.css">
  </head>
  <body>
    <div id="app">
      <main class="app-boot-screen" role="status" aria-live="polite" aria-label="Loading File Viewer">
        <div class="app-boot-shell">
          <section class="app-boot-preview" aria-hidden="true">
            <div class="app-boot-toolbar">
              <span class="app-boot-dot"></span>
              <span class="app-boot-chip"></span>
              <span class="app-boot-chip"></span>
              <span class="app-boot-chip"></span>
            </div>
            <div class="app-boot-canvas">
              <div class="app-boot-nav">
                <span class="app-boot-line"></span>
                <span class="app-boot-line"></span>
                <span class="app-boot-line"></span>
              </div>
              <div class="app-boot-page"></div>
            </div>
          </section>
        </div>
      </main>
    </div>
  </body>
</html>

    <style>
      :root {
        color-scheme: light;
        background: #eef5f1;
      }

      html,
      body {
        margin: 0;
        min-width: 320px;
        min-height: 100%;
        background: #eef5f1;
        color: #172033;
        font-family: Aptos, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;

        -moz-osx-font-smoothing: grayscale;
      }

      body {
        min-height: 100vh;
      }

      #app {
        min-height: 100vh;
      }

      /* Vue mounting skeleton — prevents blank screen during load */
      .app-boot-screen {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
        background:
          linear-gradient(90deg, rgba(31, 150, 110, 0.07) 1px, transparent 1px),
          linear-gradient(180deg, rgba(31, 150, 110, 0.06) 1px, transparent 1px),
          linear-gradient(135deg, #eef5f1 0%, #f8fbff 52%, #edf7f2 100%);
        background-size: 28px 28px, 28px 28px, auto;
        box-sizing: border-box;
      }

      .app-boot-shell {
        width: min(960px, 100%);
        display: grid;
        grid-template-columns: 1fr;
        gap: 18px;
        align-items: stretch;
      }

      .app-boot-preview {
        min-width: 0;
        border: 1px solid rgba(114, 137, 161, 0.2);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 24px 70px rgba(41, 66, 90, 0.12);
        display: grid;
        grid-template-rows: auto 1fr;
        overflow: hidden;
      }

      .app-boot-toolbar {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 14px 16px;
        border-bottom: 1px solid rgba(114, 137, 161, 0.18);
      }

      .app-boot-dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: #1f966e;
      }

      .app-boot-chip,
      .app-boot-line,
      .app-boot-page {
        background: linear-gradient(90deg, #eef3f7 0%, #f9fbfd 45%, #e7eff4 100%);
        background-size: 240% 100%;
        animation: bootShimmer 1.6s ease-in-out infinite;
      }

      .app-boot-chip {
        width: 86px;
        height: 18px;
        border-radius: 999px;
      }

      .app-boot-chip:nth-child(4) {
        width: 118px;
        margin-left: auto;
      }

      .app-boot-canvas {
        display: grid;
        grid-template-columns: 140px 1fr;
        gap: 18px;
        padding: 18px;
        background: #f4f8fb;
      }

      .app-boot-nav {
        display: grid;
        gap: 12px;
        align-content: start;
      }

      .app-boot-line {
        height: 14px;
        border-radius: 999px;
      }

      .app-boot-line:nth-child(2) {
        width: 72%;
      }

      .app-boot-line:nth-child(3) {
        width: 86%;
      }

      .app-boot-page {
        min-height: 300px;
        border: 1px solid rgba(114, 137, 161, 0.16);
        border-radius: 8px;
        background-color: #ffffff;
      }

      @keyframes bootShimmer {
        0% {
          background-position: 160% 0;
        }

        100% {
          background-position: -120% 0;
        }
      }

      @media (max-width: 720px) {
        .app-boot-screen {
          padding: 18px;
        }

        .app-boot-canvas {
          grid-template-columns: 1fr;
        }

        .app-boot-nav {
          display: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-boot-chip,
        .app-boot-line,
        .app-boot-page {
          animation: none;
        }
      }

      /* === Craftisle: hide sample files section ONLY === */
      /* Hide .sample-picker (sample files section), NOT the entire panel! */
      .sample-picker,
      [class*="sample-picker"] {
        display: none !important;
      }
    </style>
    <script>
      // === Craftisle: rebrand only (no panel hiding here) ===
      function doFixes() {
        if (!document.body) return;

        // 1. Replace brand text in all text nodes
        const walk = document.createTreeWalker(
          document.body,
          NodeFilter.SHOW_TEXT,
          null,
          false
        );
        let node;
        while (node = walk.nextNode()) {
          const v = node.nodeValue;
          if (v.includes('FlyFish')) {
            node.nodeValue = v.replace(/FlyFish/g, 'Craftisle');
          }
          if (v.includes('flyfish')) {
            node.nodeValue = v.replace(/flyfish/g, 'craftisle');
          }
          if (v.includes('Pure Web')) {
            node.nodeValue = v.replace(/Pure Web/g, 'Free Online');
          }
        }

        // 2. Replace brand in attributes
        document.querySelectorAll('[aria-label],[title],[placeholder]').forEach(el => {
          ['aria-label','title','placeholder'].forEach(attr => {
            const v = el.getAttribute(attr);
            if (!v) return;
            if (v.includes('FlyFish')) el.setAttribute(attr, v.replace(/FlyFish/g, 'Craftisle'));
            if (v.includes('flyfish')) el.setAttribute(attr, v.replace(/flyfish/g, 'craftisle'));
            if (v.includes('Pure Web')) el.setAttribute(attr, v.replace(/Pure Web/g, 'Free Online'));
          });
        });

        // 3. Hide logo images
        document.querySelectorAll('img').forEach(img => {
          const src = (img.getAttribute('src') || '').toLowerCase();
          const alt = (img.getAttribute('alt') || '').toLowerCase();
          if (src.includes('logo') || alt.includes('logo')) {
            img.style.display = 'none';
          }
        });
      }

      // Run once on DOM ready
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', doFixes);
      } else {
        doFixes();
      }

      // Re-run after Vue re-renders
      const obs = new MutationObserver(() => { doFixes(); });
      obs.observe(document.documentElement, { childList: true, subtree: true });
    </script>

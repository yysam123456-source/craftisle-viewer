<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="./favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#eef5f1">
    <title>File Viewer — Preview 135+ File Formats</title>
    <style>
      :root {
        color-scheme: light;
        background: #eef5f1;
      }

      html,
      body {
        margin: 0;
        min-width: 320px;
        min-height: 100%;
        background: #eef5f1;
        color: #172033;
        font-family: Aptos, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      body {
        min-height: 100vh;
      }

      #app {
        min-height: 100vh;
      }

      /* Vue mounting skeleton — prevents blank screen during load */
      .app-boot-screen {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
        background:
          linear-gradient(90deg, rgba(31, 150, 110, 0.07) 1px, transparent 1px),
          linear-gradient(180deg, rgba(31, 150, 110, 0.06) 1px, transparent 1px),
          linear-gradient(135deg, #eef5f1 0%, #f8fbff 52%, #edf7f2 100%);
        background-size: 28px 28px, 28px 28px, auto;
        box-sizing: border-box;
      }

      .app-boot-shell {
        width: min(960px, 100%);
        display: grid;
        grid-template-columns: 1fr;
        gap: 18px;
        align-items: stretch;
      }

      .app-boot-preview {
        min-width: 0;
        border: 1px solid rgba(114, 137, 161, 0.2);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 24px 70px rgba(41, 66, 90, 0.12);
        display: grid;
        grid-template-rows: auto 1fr;
        overflow: hidden;
      }

      .app-boot-toolbar {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 14px 16px;
        border-bottom: 1px solid rgba(114, 137, 161, 0.18);
      }

      .app-boot-dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: #1f966e;
      }

      .app-boot-chip,
      .app-boot-line,
      .app-boot-page {
        background: linear-gradient(90deg, #eef3f7 0%, #f9fbfd 45%, #e7eff4 100%);
        background-size: 240% 100%;
        animation: bootShimmer 1.6s ease-in-out infinite;
      }

      .app-boot-chip {
        width: 86px;
        height: 18px;
        border-radius: 999px;
      }

      .app-boot-chip:nth-child(4) {
        width: 118px;
        margin-left: auto;
      }

      .app-boot-canvas {
        display: grid;
        grid-template-columns: 140px 1fr;
        gap: 18px;
        padding: 18px;
        background: #f4f8fb;
      }

      .app-boot-nav {
        display: grid;
        gap: 12px;
        align-content: start;
      }

      .app-boot-line {
        height: 14px;
        border-radius: 999px;
      }

      .app-boot-line:nth-child(2) {
        width: 72%;
      }

      .app-boot-line:nth-child(3) {
        width: 86%;
      }

      .app-boot-page {
        min-height: 300px;
        border: 1px solid rgba(114, 137, 161, 0.16);
        border-radius: 8px;
        background-color: #ffffff;
      }

      @keyframes bootShimmer {
        0% {
          background-position: 160% 0;
        }

        100% {
          background-position: -120% 0;
        }
      }

      @media (max-width: 720px) {
        .app-boot-screen {
          padding: 18px;
        }

        .app-boot-canvas {
          grid-template-columns: 1fr;
        }

        .app-boot-nav {
          display: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-boot-chip,
        .app-boot-line,
        .app-boot-page {
          animation: none;
        }
      }
    </style>
    <script>
      // Hide FlyFish brand area after Vue mounts
      const hideBrand = () => {
        const els = document.querySelectorAll('[class*="brand"]');
        els.forEach(el => el.style.display = 'none');
      };
      // Try immediately + watch for DOM changes
      hideBrand();
      new MutationObserver(hideBrand).observe(document.body, { childList: true, subtree: true });

      // Disable sample file clicks (clear urls) after Vue mounts
      const disableSampleClic = () => {
        // Find all sample file items and remove click handlers
        const items = document.querySelectorAll('[class*="sample"]');
        items.forEach(el => {
          el.style.pointerEvents = 'none';
          el.style.opacity = '0.6';
        });
      };
      setTimeout(disableSampleClic, 2000);
      new MutationObserver(() => setTimeout(disableSampleClic, 500))
        .observe(document.body, { childList: true, subtree: true });
    </script>
    <script type="module" crossorigin src="./assets/index-CLEdsJjy.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BjTZLd3d.css">
  </head>
  <body>
    <div id="app">
      <main class="app-boot-screen" role="status" aria-live="polite" aria-label="Loading File Viewer">
        <div class="app-boot-shell">
          <section class="app-boot-preview" aria-hidden="true">
            <div class="app-boot-toolbar">
              <span class="app-boot-dot"></span>
              <span class="app-boot-chip"></span>
              <span class="app-boot-chip"></span>
              <span class="app-boot-chip"></span>
            </div>
            <div class="app-boot-canvas">
              <div class="app-boot-nav">
                <span class="app-boot-line"></span>
                <span class="app-boot-line"></span>
                <span class="app-boot-line"></span>
              </div>
              <div class="app-boot-page"></div>
            </div>
          </section>
        </div>
      </main>
    </div>
  </body>
</html>
